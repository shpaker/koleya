run:
  timeout: 5m
  tests: true

linters-settings:
  goimports:
    local-prefixes: github.com/shpaker/koleya
  misspell:
    locale: US
  # koleya is pure math: no engine, no IO (see AGENTS.md)
  depguard:
    rules:
      core:
        files:
          - "$all"
        deny:
          - pkg: github.com/hajimehoshi/ebiten
            desc: koleya knows no engine
          - pkg: os
            desc: koleya does no IO
          - pkg: syscall/js
            desc: koleya knows no platform

linters:
  disable-all: true
  enable:
    - depguard
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - typecheck

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
